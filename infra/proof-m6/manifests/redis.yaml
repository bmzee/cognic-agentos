# infra/proof-m6/manifests/redis.yaml — Redis control plane for the M6 proof.
#
# NEW vs proof-m5: the governed skill executor exists only when the lifespan
# constructs the managed sandbox runtime, and that construction is gated on
# `runtime.scheduler is not None` (portal/api/app.py) — the Sprint-13.7
# scheduler is CACHE-CONDITIONAL (built only when adapters.cache is wired, ADR-022).
# So the M6 overlay flips cache.enabled=true (COGNIC_CACHE_DRIVER=redis) and this
# manifest supplies the Redis the quota/kill-switch/scheduler control plane needs.
# Deliberately mirrors the chart smoke backends' style (plain Deployment+Service,
# tag-pinned image, minimal probes); applied by run-proof-m6.sh alongside the six
# shared backends, BEFORE the AgentOS chart installs.
apiVersion: apps/v1
kind: Deployment
metadata: { name: redis, labels: { app: redis } }
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 6379 }]
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata: { name: redis }
spec:
  selector: { app: redis }
  ports: [{ port: 6379, targetPort: 6379 }]
