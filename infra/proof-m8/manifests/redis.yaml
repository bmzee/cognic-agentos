# infra/proof-m8/manifests/redis.yaml — Redis control plane for the M8 proof.
#
# Carried forward from proof-m6 unchanged in substance: the Sprint-13.7
# scheduler is CACHE-CONDITIONAL (built only when adapters.cache is wired,
# ADR-022), and M8 needs it TWICE over —
#   * the lifespan constructs the sandbox backend + skill executor ONLY when
#     `runtime.scheduler is not None` (portal/api/app.py) — the hosted_skills
#     surface Step 0 asserts (the 4 instruction skills) exists only on that
#     path (the M6 executable-skill posture, unchanged);
#   * the governed memory API (the BAR-1 task-tier memory row rides
#     PostgresMemoryAdapter, but the memory factory itself is built on the
#     cache-wired runtime branch — harness/runtime.py).
# So the M8 overlay keeps cache.enabled=true (COGNIC_CACHE_DRIVER=redis) and
# this manifest supplies the Redis. Deliberately mirrors the chart smoke
# backends' style (plain Deployment+Service, tag-pinned image, minimal probes);
# applied by run-proof-m8.sh alongside the six shared backends, BEFORE the
# AgentOS chart installs.
apiVersion: apps/v1
kind: Deployment
metadata: { name: redis, labels: { app: redis } }
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 6379 }]
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata: { name: redis }
spec:
  selector: { app: redis }
  ports: [{ port: 6379, targetPort: 6379 }]
