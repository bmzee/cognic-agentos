# infra/proof-m85c/agentos-sandbox-patch.yaml — strategic-merge patch applied by
# run-proof-m85c.sh to deploy/rel-agentos AFTER `helm install` (the chart ships no
# extraVolumes/extraEnv hooks, and these surfaces are PROOF-TOPOLOGY, not chart
# contract). Carries the proof-m6 sandbox topology UNCHANGED (the M6
# executable-skill posture is a Step-0 precondition) PLUS the ONE M8 addition:
#
#   * docker-sock — the host docker socket hostPath (through the kind node's
#     extraMount) so the DockerSibling backend's aiodocker client reaches the
#     host daemon that runs the sandbox sibling containers.
#   * broker-share + TMPDIR — the skill broker creates its per-invocation 0700
#     socket dir under tempfile.gettempdir(); TMPDIR points it at the
#     host-shared path so the SAME absolute path exists in the pod (where the
#     broker binds) and on the docker host (where the backend bind-mounts it
#     into the workload). PROOF-ONLY side effect: every kernel tempfile lands
#     on this hostPath for the proof's lifetime.
#   * broker-share-perms initContainer — the hostPath dir is root-owned 0755 at
#     creation; chmod 1777 (sticky, world-writable — /tmp semantics) lets the
#     uid-65534 kernel pod mkdir its 0700 per-invocation dirs while every dir
#     stays owner-locked. It ALSO grants the pod the docker socket: the
#     node-mounted sock is root-owned and the uid/gid-65534 kernel pod got
#     "Permission denied" from aiodocker (hit live M6 run 9, 2026-07-04) —
#     chgrp 65534 + 0660 is the TIGHTEST workable grant (group-scoped, NOT
#     0666; reverts on Docker Desktop restart). Runs as root (the ONLY root
#     step in the pod); PROOF-ONLY.
#   * query-context (M8, ADR-027 §c) — the kernel's query-context SIGNING key
#     as a RUNTIME Secret mount at /run/cognic/query-context (readOnly,
#     0440). The runner mints the keypair per run and `kubectl create
#     secret`s the PRIVATE PEM from a proof-local tmpdir — the key NEVER
#     enters a build context, an image layer, or a tracked file (the C1
#     custody contract). The image ENV
#     COGNIC_AGENT_QUERY_CONTEXT_SIGNING_KEY_PATH points at exactly this
#     mount; an unreadable/missing key fails the loop composition loud (the
#     ask route 503s + Step 0's hosted_agents assert catches it).
#
# --- M8.5-C additions (the TLS matrix, spec §5.1) ---------------------------------
#   * agentos-tls — the kernel's OWN server certificate. AgentOS serves HTTPS in
#     this proof because the spec's TLS matrix requires BOTH the BFF->AgentOS and
#     the proof-driver->AgentOS legs to be HTTPS under the fixed proof CA. The
#     cert is minted per run with SANs covering every way it is dialled
#     (`rel-agentos` in-cluster; `127.0.0.1` through the host port-forward), and
#     the proof image's CMD passes it to uvicorn's --ssl-* flags.
#   * proof-ca — the per-run CA. The reference OIDC binder's discovery + JWKS
#     fetches verify Keycloak against exactly this bundle; there is no
#     `verify=False` path and no default-trust-store fallback.
#   * PROBE SCHEME — the chart's three probes are httpGet on the named `http`
#     port and default to the HTTP scheme. Now that the port speaks TLS they must
#     be flipped to HTTPS or the pod never goes Ready. The chart exposes no
#     probe-scheme knob, and probe scheme is PROOF TOPOLOGY, not chart contract —
#     so it is patched here alongside the rest of the topology. (kubelet does not
#     verify the probe's certificate, which is correct: a probe is a liveness
#     signal, not a trust boundary.)
spec:
  template:
    spec:
      initContainers:
        - name: broker-share-perms
          image: busybox:1.36
          command:
            [
              "sh",
              "-c",
              "chmod 1777 /var/lib/cognic-proof-m85c-broker && chgrp 65534 /var/run/docker.sock && chmod 0660 /var/run/docker.sock",
            ]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          volumeMounts:
            - name: broker-share
              mountPath: /var/lib/cognic-proof-m85c-broker
            - name: docker-sock
              mountPath: /var/run/docker.sock
      containers:
        - name: agentos
          env:
            - name: TMPDIR
              value: /var/lib/cognic-proof-m85c-broker
          # The chart's probes are httpGet without a scheme (=> HTTP). The port
          # now speaks TLS, so all three must say HTTPS or the pod never Readies.
          startupProbe:
            httpGet:
              scheme: HTTPS
          livenessProbe:
            httpGet:
              scheme: HTTPS
          readinessProbe:
            httpGet:
              scheme: HTTPS
          volumeMounts:
            - name: docker-sock
              mountPath: /var/run/docker.sock
            - name: broker-share
              mountPath: /var/lib/cognic-proof-m85c-broker
            - name: query-context
              mountPath: /run/cognic/query-context
              readOnly: true
            - name: action-context
              mountPath: /run/cognic/action-context
              readOnly: true
            - name: agentos-tls
              mountPath: /etc/agentos-tls
              readOnly: true
            - name: proof-ca
              mountPath: /etc/proof-ca
              readOnly: true
      volumes:
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
        - name: broker-share
          hostPath:
            path: /var/lib/cognic-proof-m85c-broker
            type: DirectoryOrCreate
        - name: query-context
          secret:
            secretName: proof-m85c-query-context
            defaultMode: 288   # 0440 — group-readable for the fsGroup-65534 pod
        - name: action-context
          secret:
            secretName: proof-m85c-action-context
            defaultMode: 288   # 0440 — separate action-mint authority, kernel only
        - name: agentos-tls
          secret:
            secretName: proof-m85c-agentos-tls
            defaultMode: 288   # 0440 — the private key stays group-only
        - name: proof-ca
          secret:
            secretName: proof-m85c-ca
            defaultMode: 292   # 0444 — a CA certificate is public bytes
