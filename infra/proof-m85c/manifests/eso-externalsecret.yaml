# The one Oracle application-credential injector: Vault -> Kubernetes Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: oracle-app-credential }
spec:
  refreshInterval: 15s
  secretStoreRef: { name: proof-vault, kind: SecretStore }
  target: { name: oracle-app-credential }
  data:
  - secretKey: password
    remoteRef: { key: "cognic/proof-m85c/oracle-app", property: password }
