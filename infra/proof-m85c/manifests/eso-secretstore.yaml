# Proof posture: ESO authenticates to the in-cluster dev Vault with its root
# token. A bank overlay replaces provider authentication; the store-to-secret
# contract and pack file mount remain unchanged.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata: { name: proof-vault }
spec:
  provider:
    vault:
      server: "http://vault:8200"
      path: "secret"
      version: "v1"
      auth:
        tokenSecretRef: { name: proof-vault-token, key: token }
