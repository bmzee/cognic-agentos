# infra/proof-m85c/manifests/oracle-pack.yaml — the released oracle-schema MCP
# tool Service (v0.5.0 — the file-credential + SET_IDENTIFIER release the
# agent's granted tool ref resolves to; the six metadata tools unchanged).
# Static private ClusterIP 10.96.0.51 (the operator-install flow materializes
# the override + allow-list rows for this exact IP). jwt mode = the REAL
# RS256/JWKS verifier (never dev_insecure). Single-effective-URL invariant:
# COGNIC_MCP_SERVER_URL == COGNIC_OAUTH_AUDIENCE == the materialized override
# server_url == the RFC-8707 resource == the token aud == this URL.
# The query-context PUBLIC key rides the image (Dockerfile.oracle-pack bakes
# proof-m85c-staging/query-context/ + sets COGNIC_QUERY_CONTEXT_PUBLIC_KEYS);
# the PRIVATE key exists ONLY in the kernel pod's runtime Secret mount.
apiVersion: apps/v1
kind: Deployment
metadata: { name: proof-oracle-pack, labels: { app: proof-oracle-pack } }
spec:
  replicas: 1
  selector: { matchLabels: { app: proof-oracle-pack } }
  template:
    metadata: { labels: { app: proof-oracle-pack } }
    spec:
      initContainers:
      - name: wait-for-oracle-db
        image: busybox:1.36
        command: ["sh", "-c", "until nc -z oracle-db 1521; do echo waiting for oracle-db; sleep 5; done"]
      containers:
      - name: oracle-pack
        image: cognic-proof-oracle-pack:m85
        imagePullPolicy: IfNotPresent
        ports: [{ containerPort: 8765 }]
        env:
        - { name: COGNIC_MCP_HOST, value: "0.0.0.0" }
        - { name: COGNIC_MCP_PORT, value: "8765" }
        - { name: COGNIC_MCP_SERVER_URL, value: "http://10.96.0.51:8765/mcp" }
        - { name: COGNIC_MCP_AS_ISSUER, value: "http://192.88.99.9:9000" }
        - { name: COGNIC_AUTH_MODE, value: "jwt" }
        - { name: COGNIC_OAUTH_ISSUER, value: "http://192.88.99.9:9000" }
        - { name: COGNIC_OAUTH_JWKS_URI, value: "http://192.88.99.9:9000/.well-known/jwks.json" }
        - { name: COGNIC_OAUTH_AUDIENCE, value: "http://10.96.0.51:8765/mcp" }
        - { name: COGNIC_REQUIRED_SCOPES, value: "oracle_schema.read" }
        - { name: COGNIC_ORACLE_DSN, value: "oracle-db:1521/FREEPDB1" }
        - { name: COGNIC_ORACLE_USER, value: "cognic" }
        - { name: COGNIC_ORACLE_PASSWORD_FILE, value: "/var/run/cognic/oracle/password" }
        # The metadata tools' owner allow-list now names the THREE analytics
        # schemas (list_tables/describe_table serve the model's schema
        # exploration); run_readonly_query authority comes ONLY from the
        # kernel-signed query-context token's object allow-set, never this.
        - { name: COGNIC_ORACLE_ALLOWED_OWNERS, value: "RETAIL_ANALYTICS,FIN,CARDS" }
        volumeMounts:
        - name: oracle-credential
          mountPath: /var/run/cognic/oracle
          readOnly: true
      volumes:
      - name: oracle-credential
        secret:
          secretName: oracle-app-credential
          defaultMode: 0400
          items:
          - { key: password, path: password }
---
apiVersion: v1
kind: Service
metadata: { name: proof-oracle-pack }
spec:
  clusterIP: 10.96.0.51
  selector: { app: proof-oracle-pack }
  ports: [{ port: 8765, targetPort: 8765 }]
