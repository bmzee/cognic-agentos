# Reference workflow — AUTHOR-FILL: review + customize.
# Sprint-7A2 hook-pack lifecycle (sign-before-validate per the
# static-only-committed-state doctrine).

name: sign-and-publish

on:
  push:
    branches: [main]

jobs:
  sign:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - run: uv lock --check
      - run: uv sync --frozen --extra dev
      - run: uv build --wheel
      - run: uv run agentos sign --bundle .
      - run: uv run agentos validate .
      - run: uv run agentos verify .
      # AUTHOR-FILL: add a publishing step.
